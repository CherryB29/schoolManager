name: push-cron

# 10분마다 먼지 서버를 깨워서, 사용자가 정한 알림 시간이 된 사람에게 알림을 보냅니다.
# (Vercel 무료 플랜의 크론은 하루 1회라서 GitHub Actions 로 대신 호출합니다.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/push-cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/push-cron?window=30"
